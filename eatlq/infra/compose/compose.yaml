      SWAP_POLLER_RPC_URL: ${SWAP_POLLER_RPC_URL:-${EVM_HTTP_URL:-https://mainnet.base.org}}
      SWAP_POLLER_RPC_URL_FALLBACK: ${SWAP_POLLER_RPC_URL_FALLBACK:-}
      SWAP_POLLER_RPC_RETRY: ${SWAP_POLLER_RPC_RETRY:-3}
      SWAP_POLLER_CATCHUP_BLOCKS: ${SWAP_POLLER_CATCHUP_BLOCKS:-400}
      EXECUTOR_RPC_URL: ${EXECUTOR_RPC_URL:-}
      CHAIN_ID: ${CHAIN_ID:-8453}
      MARKET_TICKS_DISCOVERY_STREAM: ${MARKET_TICKS_DISCOVERY_STREAM:-market_ticks_discovery}
      MARKET_TICKS_DISCOVERY_MAXLEN: ${MARKET_TICKS_DISCOVERY_MAXLEN:-1000000}
      MARKET_TICKS_STREAM: ${MARKET_TICKS_STREAM:-market_ticks}
      MARKET_TICKS_MAXLEN: ${MARKET_TICKS_MAXLEN:-2000000}
      SWAP_POLLER_INTERVAL_SEC: ${SWAP_POLLER_INTERVAL_SEC:-300}
      SWAP_POLLER_POOL_MAX_AGE_H: ${SWAP_POLLER_POOL_MAX_AGE_H:-72}
      SMART_MONEY_POOL_MAX_AGE_H: ${SMART_MONEY_POOL_MAX_AGE_H:-72}
