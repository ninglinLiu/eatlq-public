      STRATEGY_BLOCK_MS: ${STRATEGY_BLOCK_MS:-1000}
      BASE_CAPITAL: ${BASE_CAPITAL:-25}
      SYSTEM_PANIC_KEY: ${SYSTEM_PANIC_KEY:-SYSTEM_PANIC}
      WHALE_FLOW_THRESHOLD: ${WHALE_FLOW_THRESHOLD:-5000}
      MODEL_DIR: ${MODEL_DIR:-models}
      DASHCAM_PATH: ${DASHCAM_PATH:-logs/dashcam.csv}
      CHAIN_ID: ${CHAIN_ID}
      STRATEGY_TOKEN_BLACKLIST: ${STRATEGY_TOKEN_BLACKLIST:-}
      STRATEGY_POOL_BLACKLIST: ${STRATEGY_POOL_BLACKLIST:-0xd0b53d9277642d899df5c87a3966a349a798f224,0x4c36388be6f416a29c8d8eee81c771ce6be14b18,0xb4cb800910b228ed3d0834cf79d697127bbb00e5,0xfcd08d68b2313cd5e1d9e0e3f3183ad7cfdbf66f}
      STRATEGY_SYMBOL_BLACKLIST: ${STRATEGY_SYMBOL_BLACKLIST:-}
      STRATEGY_SIGNAL_THRESHOLD: ${STRATEGY_SIGNAL_THRESHOLD:-0.40}
      SIGNAL_MIN_CONFIDENCE: ${SIGNAL_MIN_CONFIDENCE:-0.52}
      STRATEGY_MIN_CONFIDENCE: ${STRATEGY_MIN_CONFIDENCE:-}
