<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" fill="none">
  <defs>
    <style>
      .bg { fill: #0B0E14; }
      .c1 { fill: #11151C; stroke: #F5A623; stroke-opacity: 0.4; }
      .c2 { fill: #11151C; stroke: #6B7280; stroke-opacity: 0.5; }
      .c3 { fill: #11151C; stroke: #E57373; stroke-opacity: 0.5; }
      .t { fill: #FFF; font: 700 13px Inter; }
      .p { fill: #F5A623; font: 700 20px Roboto Mono; }
      .s { fill: #9E9E9E; font: 400 11px Inter; }
      .title { fill: #9E9E9E; font: 600 11px Inter; letter-spacing: 0.12em; }
    </style>
  </defs>
  <rect width="960" height="220" class="bg" rx="10"/>
  <text x="32" y="28" class="title">POSITION MANAGER · TRIPLE STOP</text>

  <rect x="32" y="52" width="280" height="140" rx="8" class="c1"/>
  <text x="56" y="84" class="t">Trailing Stop</text>
  <text x="56" y="112" class="p">5%</text>
  <text x="56" y="136" class="s">from peak · while in profit</text>
  <text x="56" y="168" class="s">→ auto SELL signal</text>

  <rect x="340" y="52" width="280" height="140" rx="8" class="c2"/>
  <text x="364" y="84" class="t">Time Stop</text>
  <text x="364" y="112" class="p">30m</text>
  <text x="364" y="136" class="s">flat ±2% range</text>
  <text x="364" y="168" class="s">→ auto SELL signal</text>

  <rect x="648" y="52" width="280" height="140" rx="8" class="c3"/>
  <text x="672" y="84" class="t">Hard Stop</text>
  <text x="672" y="112" class="p">15%</text>
  <text x="672" y="136" class="s">unconditional loss cap</text>
  <text x="672" y="168" class="s">→ auto SELL signal</text>
</svg>
