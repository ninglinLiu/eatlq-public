# Compose profiles (opt-in services):
#   --profile strategy   — strategy_engine, pool-discovery, swap-poller, shadow-closer, wallet-scorer
#   --profile executor   — executor (set EXECUTOR_DRY_RUN / RPC via .env; not live authorization)
#   --profile dashboard  — optional HTTP dashboard (laszlo.sh enables all three for a full stack)
#   --profile backfill   — backfill-only jobs (not required for paper observation path)
# Core infra (redis, postgres, clickhouse, archiver, autoheal) starts without profiles.
# Ingestion (ingestor) is opt-in: docker compose --profile ingestion up -d ingestor
services:
  redis:
    image: redis:7.4-alpine
    labels:
      - "autoheal=true"
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    networks:
      - eatlq-net
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    labels:
      - "autoheal=true"
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    networks:
      - eatlq-net
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ../clickhouse/config/config.xml:/etc/clickhouse-server/config.d/eatlq.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    labels:
      - "autoheal=true"
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      [
        "postgres",
        "-c",
        "max_connections=100",
        "-c",
        "shared_buffers=256MB",
        "-c",
        "wal_level=replica",
      ]
    networks:
      - eatlq-net
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ingestor:
    labels:
      - "autoheal=true"
    build:
      context: ../..
      dockerfile: services/ingestor/Dockerfile
    profiles: ["ingestion"]
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      RUST_LOG: ${RUST_LOG}
      EVM_WS_URL: ${EVM_WS_URL}
      EVM_HTTP_URL: ${EVM_HTTP_URL:-}
      WS_SOURCE: ${WS_SOURCE:-quicknode}
      CHAIN_ID: ${CHAIN_ID}
      WS_SUBSCRIBE_METHOD: ${WS_SUBSCRIBE_METHOD}
      WS_SUBSCRIBE_PARAMS_JSON: ${WS_SUBSCRIBE_PARAMS_JSON}
      LOG_FILTER_JSON: ${LOG_FILTER_JSON:-}
      WS_RECONNECT_INITIAL_BACKOFF_MS: ${WS_RECONNECT_INITIAL_BACKOFF_MS}
      WS_RECONNECT_MAX_BACKOFF_MS: ${WS_RECONNECT_MAX_BACKOFF_MS}
      WS_READ_TIMEOUT_SECS: ${WS_READ_TIMEOUT_SECS}
      RPC_REQUEST_TIMEOUT_SECS: ${RPC_REQUEST_TIMEOUT_SECS:-30}
      REDIS_URL: ${REDIS_URL}
      MARKET_TICKS_STREAM: ${MARKET_TICKS_STREAM}
      MARKET_TICKS_MAXLEN: ${MARKET_TICKS_MAXLEN}
      REDIS_BATCH_SIZE: ${REDIS_BATCH_SIZE}
      REDIS_BATCH_TIMEOUT_MS: ${REDIS_BATCH_TIMEOUT_MS}
      RAW_CHANNEL_CAPACITY: ${RAW_CHANNEL_CAPACITY}
      RECORD_CHANNEL_CAPACITY: ${RECORD_CHANNEL_CAPACITY}
      INGESTOR_HEALTHCHECK_PATH: ${INGESTOR_HEALTHCHECK_PATH}
      EVM_WS_URLS_POOL: ${EVM_WS_URLS_POOL:-}
      EVM_HTTP_URLS_POOL: ${EVM_HTTP_URLS_POOL:-}
      WS_CONNECT_TIMEOUT_SECS: ${WS_CONNECT_TIMEOUT_SECS:-10}
      INGESTOR_STALL_SECS: ${INGESTOR_STALL_SECS:-300}
      INGESTOR_STALL_GRACE_SECS: ${INGESTOR_STALL_GRACE_SECS:-120}
      INGESTOR_WS_IDLE_SECS: ${INGESTOR_WS_IDLE_SECS:-120}
      INGESTOR_POOL_COOLDOWN_SECS: ${INGESTOR_POOL_COOLDOWN_SECS:-15}
      INGESTOR_POOL_BAN_SECS: ${INGESTOR_POOL_BAN_SECS:-120}
      INGESTOR_POOL_MAX_CONSECUTIVE_FAILS: ${INGESTOR_POOL_MAX_CONSECUTIVE_FAILS:-4}
      INGESTOR_HTTP_HEAD_POLL_MS: ${INGESTOR_HTTP_HEAD_POLL_MS:-2000}
      INGESTOR_CATCHUP_CHUNK: ${INGESTOR_CATCHUP_CHUNK:-20}
      INGESTOR_CATCHUP_MAX_BLOCKS: ${INGESTOR_CATCHUP_MAX_BLOCKS:-300}
      INGESTOR_CATCHUP_PAUSE_MS: ${INGESTOR_CATCHUP_PAUSE_MS:-50}
      BACKFILL_STATE_POSTGRES_URL: ${BACKFILL_STATE_POSTGRES_URL:-}
    networks:
      - eatlq-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find ${INGESTOR_HEALTHCHECK_PATH:-/tmp/ingestor_healthy} -mmin -2 | grep -q ."]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  backfill:
    build:
      context: ../..
      dockerfile: services/ingestor/Dockerfile
    profiles: ["backfill"]
    command: ["backfill"]
    restart: "no"
    environment:
      TZ: ${TZ}
      RUST_LOG: ${RUST_LOG}
      EVM_WS_URL: ${EVM_WS_URL}
      EVM_HTTP_URL: ${EVM_HTTP_URL:-}
      WS_SOURCE: ${WS_SOURCE:-quicknode}
      CHAIN_ID: ${CHAIN_ID}
      WS_SUBSCRIBE_METHOD: ${WS_SUBSCRIBE_METHOD}
      WS_SUBSCRIBE_PARAMS_JSON: ${WS_SUBSCRIBE_PARAMS_JSON}
      LOG_FILTER_JSON: ${LOG_FILTER_JSON:-}
      WS_RECONNECT_INITIAL_BACKOFF_MS: ${WS_RECONNECT_INITIAL_BACKOFF_MS}
      WS_RECONNECT_MAX_BACKOFF_MS: ${WS_RECONNECT_MAX_BACKOFF_MS}
      WS_READ_TIMEOUT_SECS: ${WS_READ_TIMEOUT_SECS}
      RPC_REQUEST_TIMEOUT_SECS: ${RPC_REQUEST_TIMEOUT_SECS:-30}
      REDIS_URL: ${REDIS_URL}
      MARKET_TICKS_STREAM: ${MARKET_TICKS_STREAM}
      MARKET_TICKS_MAXLEN: ${MARKET_TICKS_MAXLEN}
      REDIS_BATCH_SIZE: ${REDIS_BATCH_SIZE}
      REDIS_BATCH_TIMEOUT_MS: ${REDIS_BATCH_TIMEOUT_MS}
      RAW_CHANNEL_CAPACITY: ${RAW_CHANNEL_CAPACITY}
      RECORD_CHANNEL_CAPACITY: ${RECORD_CHANNEL_CAPACITY}
      INGESTOR_HEALTHCHECK_PATH: ${INGESTOR_HEALTHCHECK_PATH}
      BACKFILL_FROM_BLOCK: ${BACKFILL_FROM_BLOCK:-}
      BACKFILL_TO_BLOCK: ${BACKFILL_TO_BLOCK:-}
      BACKFILL_CHUNK_SIZE: ${BACKFILL_CHUNK_SIZE:-100}
      BACKFILL_CONFIRMATIONS: ${BACKFILL_CONFIRMATIONS:-6}
      BACKFILL_PAUSE_MS: ${BACKFILL_PAUSE_MS:-0}
      BACKFILL_SOURCE_SUFFIX: ${BACKFILL_SOURCE_SUFFIX:-backfill}
      BACKFILL_STATE_POSTGRES_URL: ${BACKFILL_STATE_POSTGRES_URL:-}
      BACKFILL_JOB_NAME: ${BACKFILL_JOB_NAME:-default}
      BACKFILL_AUTO_CLAIM_PENDING_GAP: ${BACKFILL_AUTO_CLAIM_PENDING_GAP:-true}
    networks:
      - eatlq-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  backfill-enqueue-gap:
