      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-eatlq}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      POOL_DISCOVERY_CLICKHOUSE_TABLE: ${POOL_DISCOVERY_CLICKHOUSE_TABLE:-discovered_pools}
      POOL_DISCOVERY_ENABLE_CLICKHOUSE: ${POOL_DISCOVERY_ENABLE_CLICKHOUSE:-1}
      EVM_HTTP_URL: ${POOL_DISCOVERY_RPC_URL:-https://mainnet.base.org}
      EXECUTOR_RPC_URL: ${EXECUTOR_RPC_URL:-}
      CHAIN_ID: ${CHAIN_ID:-8453}
      MARKET_TICKS_STREAM: ${MARKET_TICKS_STREAM:-market_ticks}
      POOL_DISCOVERY_GROUP: ${POOL_DISCOVERY_GROUP:-pool_discovery_group}
      POOL_DISCOVERY_CONSUMER: ${POOL_DISCOVERY_CONSUMER:-discovery-1}
