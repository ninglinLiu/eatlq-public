      WS_SOURCE: ${WS_SOURCE:-quicknode}
      CHAIN_ID: ${CHAIN_ID}
      WS_SUBSCRIBE_METHOD: ${WS_SUBSCRIBE_METHOD}
      WS_SUBSCRIBE_PARAMS_JSON: ${WS_SUBSCRIBE_PARAMS_JSON}
      LOG_FILTER_JSON: ${LOG_FILTER_JSON:-}
      WS_RECONNECT_INITIAL_BACKOFF_MS: ${WS_RECONNECT_INITIAL_BACKOFF_MS}
      WS_RECONNECT_MAX_BACKOFF_MS: ${WS_RECONNECT_MAX_BACKOFF_MS}
      WS_READ_TIMEOUT_SECS: ${WS_READ_TIMEOUT_SECS}
      RPC_REQUEST_TIMEOUT_SECS: ${RPC_REQUEST_TIMEOUT_SECS:-30}
      REDIS_URL: ${REDIS_URL}
      MARKET_TICKS_STREAM: ${MARKET_TICKS_STREAM}
      MARKET_TICKS_MAXLEN: ${MARKET_TICKS_MAXLEN}
      REDIS_BATCH_SIZE: ${REDIS_BATCH_SIZE}
      REDIS_BATCH_TIMEOUT_MS: ${REDIS_BATCH_TIMEOUT_MS}
      RAW_CHANNEL_CAPACITY: ${RAW_CHANNEL_CAPACITY}
      RECORD_CHANNEL_CAPACITY: ${RECORD_CHANNEL_CAPACITY}
      INGESTOR_HEALTHCHECK_PATH: ${INGESTOR_HEALTHCHECK_PATH}
      BACKFILL_FROM_BLOCK: ${BACKFILL_FROM_BLOCK:-}
      BACKFILL_TO_BLOCK: ${BACKFILL_TO_BLOCK:-}
      BACKFILL_CHUNK_SIZE: ${BACKFILL_CHUNK_SIZE:-100}
      BACKFILL_CONFIRMATIONS: ${BACKFILL_CONFIRMATIONS:-6}
      BACKFILL_PAUSE_MS: ${BACKFILL_PAUSE_MS:-0}
      BACKFILL_SOURCE_SUFFIX: ${BACKFILL_SOURCE_SUFFIX:-backfill}
      BACKFILL_STATE_POSTGRES_URL: ${BACKFILL_STATE_POSTGRES_URL:-}
      BACKFILL_JOB_NAME: ${BACKFILL_JOB_NAME:-default}
      BACKFILL_AUTO_CLAIM_PENDING_GAP: ${BACKFILL_AUTO_CLAIM_PENDING_GAP:-true}
      BACKFILL_SCHEDULER_POLL_INTERVAL_MS: ${BACKFILL_SCHEDULER_POLL_INTERVAL_MS:-30000}
    networks:
      - eatlq-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  archiver:
    labels:
      - "autoheal=true"
    build:
      context: ../..
      dockerfile: services/archiver/Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      RUST_LOG: ${RUST_LOG:-info,archiver=debug}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MARKET_TICKS_STREAM: ${MARKET_TICKS_STREAM:-market_ticks}
      ARCHIVER_STREAMS: ${ARCHIVER_STREAMS:-market_ticks,market_ticks_discovery}
      ARCHIVER_GROUP: ${ARCHIVER_GROUP:-archiver_group}
      ARCHIVER_CONSUMER: ${ARCHIVER_CONSUMER:-archiver-1}
      ARCHIVER_READ_COUNT: ${ARCHIVER_READ_COUNT:-250}
      ARCHIVER_BLOCK_MS: ${ARCHIVER_BLOCK_MS:-1000}
      ARCHIVER_PENDING_MIN_IDLE_MS: ${ARCHIVER_PENDING_MIN_IDLE_MS:-60000}
      ARCHIVER_PENDING_RECLAIM_COUNT: ${ARCHIVER_PENDING_RECLAIM_COUNT:-250}
      ARCHIVER_PENDING_RECLAIM_INTERVAL_MS: ${ARCHIVER_PENDING_RECLAIM_INTERVAL_MS:-30000}
      ARCHIVER_CLICKHOUSE_INSERT_TIMEOUT_SECS: ${ARCHIVER_CLICKHOUSE_INSERT_TIMEOUT_SECS:-120}
      ARCHIVER_MAX_IDLE_FLUSH_SECS: ${ARCHIVER_MAX_IDLE_FLUSH_SECS:-120}
      ARCHIVER_STARTUP_RECOVER_MAX_BATCHES: ${ARCHIVER_STARTUP_RECOVER_MAX_BATCHES:-200}
      ARCHIVER_BATCH_SIZE: ${ARCHIVER_BATCH_SIZE:-1000}
      ARCHIVER_BATCH_TIMEOUT_MS: ${ARCHIVER_BATCH_TIMEOUT_MS:-1000}
      ARCHIVER_CLICKHOUSE_TABLE: ${ARCHIVER_CLICKHOUSE_TABLE:-raw_evm_logs}
      ARCHIVER_HEALTHCHECK_PATH: ${ARCHIVER_HEALTHCHECK_PATH:-/tmp/archiver_healthy}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-eatlq}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    networks:
      - eatlq-net
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      # Freshness, not mere existence. The archiver heartbeats this file on every
      # healthy loop iteration; if the loop hangs (CH insert stall, deadlock, etc.)
      # the file goes stale and docker marks the container unhealthy so autoheal
      # restarts it. `test -f` alone could not detect a "fake alive" zombie
      # (root cause of the 2026-06-25 38h stall).
      test: ["CMD-SHELL", "find ${ARCHIVER_HEALTHCHECK_PATH:-/tmp/archiver_healthy} -mmin -2 | grep -q ."]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 45s

  strategy:
    build:
      context: ../..
      dockerfile: services/strategy/Dockerfile
    profiles: ["strategy"]
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      REDIS_URL: ${REDIS_URL}
      EVM_HTTP_URL: ${EVM_HTTP_URL:-}
      MARKET_TICKS_STREAM: ${MARKET_TICKS_STREAM}
