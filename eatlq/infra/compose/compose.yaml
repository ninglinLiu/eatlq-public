      SMART_MONEY_POOL_MAX_AGE_H: ${SMART_MONEY_POOL_MAX_AGE_H:-24}
      STRATEGY_REQUIRE_MANIFEST: ${STRATEGY_REQUIRE_MANIFEST:-0}
      SHADOW_VERSION: ${SHADOW_VERSION:-v_current}
      SHADOW_NOTIONAL_WEI: ${SHADOW_NOTIONAL_WEI:-500000000000000}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-eatlq}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    networks:
      - eatlq-net
    volumes:
      - ../../models:/app/models
      - ../../logs:/app/logs
      - ../../scripts:/app/scripts
      - ../../services/strategy/src:/app/services/strategy/src
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  executor:
    labels:
      - "autoheal=true"
    build:
      context: ../..
      dockerfile: services/executor/Dockerfile
    profiles: ["executor"]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SIGNALS_STREAM: ${SIGNALS_STREAM:-signals}
      EXECUTOR_CONSUMER_GROUP: ${EXECUTOR_CONSUMER_GROUP:-execution_group}
      EXECUTOR_CONSUMER_NAME: ${EXECUTOR_CONSUMER_NAME:-executor-1}
      SIGNALS_CONSUMER_GROUP: ${SIGNALS_CONSUMER_GROUP:-${EXECUTOR_CONSUMER_GROUP:-execution_group}}
      SIGNALS_CONSUMER_NAME: ${SIGNALS_CONSUMER_NAME:-${EXECUTOR_CONSUMER_NAME:-executor-1}}
      EXECUTOR_READ_RPC_URL: ${EXECUTOR_READ_RPC_URL:-${EXECUTOR_RPC_URL:-}}
      EXECUTOR_READ_RPC_URL_FALLBACK: ${EXECUTOR_READ_RPC_URL_FALLBACK:-}
      EXECUTOR_READ_RPC_EXTRAS: ${EXECUTOR_READ_RPC_EXTRAS:-}
      EXECUTOR_RPC_RETRY: ${EXECUTOR_RPC_RETRY:-3}
      EXECUTOR_SEND_RPC_URL: ${EXECUTOR_SEND_RPC_URL:-${EXECUTOR_RPC_URL:-}}
      EXECUTOR_SEND_RPC_URL_FALLBACK: ${EXECUTOR_SEND_RPC_URL_FALLBACK:-}
      EXECUTOR_RPC_URL: ${EXECUTOR_RPC_URL:-}
      EXECUTOR_MEV_PROTECTED: ${EXECUTOR_MEV_PROTECTED:-1}
      EXECUTOR_FRICTION_MIN: ${EXECUTOR_FRICTION_MIN:--0.05}
      EXECUTOR_FRICTION_FAIL_CLOSED: ${EXECUTOR_FRICTION_FAIL_CLOSED:-1}
      # Executable-sell gate: replay the real router sell at realistic gas via
      # state override to catch gas-bomb honeypots that pass QuoterV2 (which runs
      # at near-unlimited gas) but revert on a real tx. Default ON.
      EXECUTOR_SELL_SIM: ${EXECUTOR_SELL_SIM:-1}
      EXECUTOR_SELL_SIM_GAS: ${EXECUTOR_SELL_SIM_GAS:-3000000}
      # If the sim cannot run (storage slot undetected / rpc error), fail closed
      # in live mode. Missing a BUY is cheaper than opening an unsellable token.
      EXECUTOR_SELL_SIM_FAIL_CLOSED: ${EXECUTOR_SELL_SIM_FAIL_CLOSED:-1}
      # External BUY-only token risk gate (GoPlus + Honeypot.is). Default strict:
      # API failures, honeypot flags, high tax, proxy/admin, unverified source,
      # mint/blacklist/anti-whale controls block new buys. Sell exits bypass this.
      EXECUTOR_EXTERNAL_RISK_GATE: ${EXECUTOR_EXTERNAL_RISK_GATE:-1}
      EXECUTOR_EXTERNAL_RISK_FAIL_CLOSED: ${EXECUTOR_EXTERNAL_RISK_FAIL_CLOSED:-1}
      EXECUTOR_EXTERNAL_RISK_PROVIDERS: ${EXECUTOR_EXTERNAL_RISK_PROVIDERS:-goplus,honeypot}
      EXECUTOR_EXTERNAL_RISK_TIMEOUT_SEC: ${EXECUTOR_EXTERNAL_RISK_TIMEOUT_SEC:-3}
      EXECUTOR_EXTERNAL_RISK_CACHE_TTL_SEC: ${EXECUTOR_EXTERNAL_RISK_CACHE_TTL_SEC:-300}
      EXECUTOR_EXTERNAL_RISK_MAX_BUY_TAX_PCT: ${EXECUTOR_EXTERNAL_RISK_MAX_BUY_TAX_PCT:-10}
      EXECUTOR_EXTERNAL_RISK_MAX_SELL_TAX_PCT: ${EXECUTOR_EXTERNAL_RISK_MAX_SELL_TAX_PCT:-10}
      EXECUTOR_EXTERNAL_RISK_MAX_OWNER_PCT: ${EXECUTOR_EXTERNAL_RISK_MAX_OWNER_PCT:-50}
      EXECUTOR_EXTERNAL_RISK_MAX_CREATOR_PCT: ${EXECUTOR_EXTERNAL_RISK_MAX_CREATOR_PCT:-50}
      EXECUTOR_EXTERNAL_RISK_BLOCK_PROXY: ${EXECUTOR_EXTERNAL_RISK_BLOCK_PROXY:-1}
      EXECUTOR_EXTERNAL_RISK_BLOCK_UNVERIFIED: ${EXECUTOR_EXTERNAL_RISK_BLOCK_UNVERIFIED:-1}
      EXECUTOR_EXTERNAL_RISK_BLOCK_MINTABLE: ${EXECUTOR_EXTERNAL_RISK_BLOCK_MINTABLE:-1}
      EXECUTOR_EXTERNAL_RISK_BLOCK_BLACKLIST: ${EXECUTOR_EXTERNAL_RISK_BLOCK_BLACKLIST:-1}
      EXECUTOR_EXTERNAL_RISK_BLOCK_ANTI_WHALE: ${EXECUTOR_EXTERNAL_RISK_BLOCK_ANTI_WHALE:-1}
      EXECUTOR_EXTERNAL_RISK_CANARY_ON_MISSING: ${EXECUTOR_EXTERNAL_RISK_CANARY_ON_MISSING:-1}
      EXECUTOR_EXTERNAL_RISK_CANARY_USD: ${EXECUTOR_EXTERNAL_RISK_CANARY_USD:-25}
      EVM_HTTP_URL: ${EVM_HTTP_URL:-}
      CHAIN_ID: ${CHAIN_ID:-8453}
      BASESCAN_API_KEY: ${BASESCAN_API_KEY:-}
      BLOCKSCOUT_URL: ${BLOCKSCOUT_URL:-https://base.blockscout.com/api}
      EXECUTOR_PRIVATE_KEY: ${EXECUTOR_PRIVATE_KEY:-}
      EXECUTOR_DRY_RUN: ${EXECUTOR_DRY_RUN:-0}
      # Sprint013 S1-T1: executor startup fail-safe needs LIVE_TRADING_MODE in-container.
      # Empty default keeps paper/dry-run posture; truthy is still rejected by the
      # paper_dryrun_readiness preflight and by main.py's LIVE+DRY mutual-exclusion.
      LIVE_TRADING_MODE: ${LIVE_TRADING_MODE:-}
      LIVE_AUTHORIZED_BY: ${LIVE_AUTHORIZED_BY:-}
      EXECUTOR_MAX_POSITION_USD: ${EXECUTOR_MAX_POSITION_USD:-100}
      # 1.0 = disabled; a 0.10 default deadlocks any wallet under 10x the stake.
      EXECUTOR_MAX_BALANCE_FRACTION: ${EXECUTOR_MAX_BALANCE_FRACTION:-1.0}
      EXECUTOR_MAX_CONCURRENT_POSITIONS: ${EXECUTOR_MAX_CONCURRENT_POSITIONS:-3}
      # Dynamic per-pool sizing: continuous binary-search on notional, capped by
      # cash, pool WETH-reserve share, pre-entry volume share, and QuoterV2 friction.
      # Default OFF (=0) keeps fixed-size behavior. Ladder kept for legacy/fallback.
      EXECUTOR_DYNAMIC_SIZING: ${EXECUTOR_DYNAMIC_SIZING:-0}
      EXECUTOR_SIZE_LADDER_USD: ${EXECUTOR_SIZE_LADDER_USD:-1000,500,300,100}
      # Continuous sizing controls: floor size, max share of pool WETH reserve
      # (depth/butterfly cap), max share of pre-entry WETH volume, bisect iters.
      EXECUTOR_SIZE_MIN_USD: ${EXECUTOR_SIZE_MIN_USD:-25}
      # ETH-native sizing (preferred). When > 0 these override the USD knobs so the
      # critical sizing path never depends on an ETH/USD oracle. USD is display-only.
      EXECUTOR_MAX_POSITION_ETH: ${EXECUTOR_MAX_POSITION_ETH:-0}
      EXECUTOR_SIZE_MIN_ETH: ${EXECUTOR_SIZE_MIN_ETH:-0}
      EXECUTOR_EXTERNAL_RISK_CANARY_ETH: ${EXECUTOR_EXTERNAL_RISK_CANARY_ETH:-0}
      EXECUTOR_MAX_GAS_ETH: ${EXECUTOR_MAX_GAS_ETH:-0}
      EXECUTOR_MAX_POOL_SHARE: ${EXECUTOR_MAX_POOL_SHARE:-0.05}
      EXECUTOR_MAX_VOLUME_SHARE: ${EXECUTOR_MAX_VOLUME_SHARE:-0.10}
      EXECUTOR_SIZE_BISECT_ITERS: ${EXECUTOR_SIZE_BISECT_ITERS:-7}
      EXECUTOR_DAILY_LOSS_PCT: ${EXECUTOR_DAILY_LOSS_PCT:-20}
      EXECUTOR_MAX_PORTFOLIO_FRACTION: ${EXECUTOR_MAX_PORTFOLIO_FRACTION:-0.30}
      EXECUTOR_MAX_GAS_USD: ${EXECUTOR_MAX_GAS_USD:-2}
      EXECUTOR_ETH_PRICE_USD: ${EXECUTOR_ETH_PRICE_USD:-3500}
      EXECUTOR_MONITOR_INTERVAL_SEC: ${EXECUTOR_MONITOR_INTERVAL_SEC:-5}
      EXECUTOR_HEARTBEAT_SEC: ${EXECUTOR_HEARTBEAT_SEC:-86400}
      EXECUTOR_SIGNAL_MAX_AGE_SEC: ${EXECUTOR_SIGNAL_MAX_AGE_SEC:-90}
      EXECUTOR_TAKE_PROFIT_PCT: ${EXECUTOR_TAKE_PROFIT_PCT:-10.0}
      EXECUTOR_STOP_LOSS_PCT: ${EXECUTOR_STOP_LOSS_PCT:-0.50}
      EXECUTOR_TRAILING_STOP_PCT: ${EXECUTOR_TRAILING_STOP_PCT:-1.0}
      EXECUTOR_TIME_DECAY_MIN: ${EXECUTOR_TIME_DECAY_MIN:-240}
      # F cluster-blacklist historical LP-pull seed toggle (1=seed 247+33, 0=experiment off;
      # PARADAENGI honeypot seeds always kept). 2026-06-25 aggressive variant.
      EXECUTOR_SEED_RUG_BLACKLIST: ${EXECUTOR_SEED_RUG_BLACKLIST:-1}
      # 30min would-be-value shadow telemetry (observability only; never sells).
      EXECUTOR_SHADOW_30MIN: ${EXECUTOR_SHADOW_30MIN:-1}
      EXECUTOR_SHADOW_30MIN_SEC: ${EXECUTOR_SHADOW_30MIN_SEC:-1800}
      EXECUTOR_READ_BLOCK_MS: ${EXECUTOR_READ_BLOCK_MS:-5000}
      EXECUTOR_READ_COUNT: ${EXECUTOR_READ_COUNT:-20}
      # ── Honeypot / LP-pull defenses (F cluster-blacklist + ① depth floor + E escape) ──
      # ① Deep-pool floor: reject any pool with < this WETH depth at entry.
      EXECUTOR_MIN_POOL_WETH: ${EXECUTOR_MIN_POOL_WETH:-3.0}
      # When the depth probe itself fails: 0 = fail-open (allow), 1 = fail-closed (block).
      EXECUTOR_MIN_POOL_WETH_FAIL_CLOSED: ${EXECUTOR_MIN_POOL_WETH_FAIL_CLOSED:-0}
      # E — post-buy delayed recheck (escape): probe sellability every N blocks for a
      # window after entry; on depth-collapse / unsellable → ABANDON + blacklist + CRITICAL.
      EXECUTOR_POSTBUY_RECHECK_BLOCKS: ${EXECUTOR_POSTBUY_RECHECK_BLOCKS:-3}
      EXECUTOR_POSTBUY_RECHECK_WINDOW_SEC: ${EXECUTOR_POSTBUY_RECHECK_WINDOW_SEC:-300}
      EXECUTOR_POSTBUY_DEPTH_COLLAPSE_ETH: ${EXECUTOR_POSTBUY_DEPTH_COLLAPSE_ETH:-0.5}
      SYSTEM_PANIC_KEY: ${SYSTEM_PANIC_KEY:-SYSTEM_PANIC}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ../../services/executor/src:/app/services/executor/src:ro
    networks:
      - eatlq-net
    depends_on:
      redis:
        condition: service_healthy

