      WS_SOURCE: ${WS_SOURCE:-quicknode}
      CHAIN_ID: ${CHAIN_ID}
      WS_SUBSCRIBE_METHOD: ${WS_SUBSCRIBE_METHOD}
      WS_SUBSCRIBE_PARAMS_JSON: ${WS_SUBSCRIBE_PARAMS_JSON}
      LOG_FILTER_JSON: ${LOG_FILTER_JSON:-}
      WS_RECONNECT_INITIAL_BACKOFF_MS: ${WS_RECONNECT_INITIAL_BACKOFF_MS}
      WS_RECONNECT_MAX_BACKOFF_MS: ${WS_RECONNECT_MAX_BACKOFF_MS}
      WS_READ_TIMEOUT_SECS: ${WS_READ_TIMEOUT_SECS}
      RPC_REQUEST_TIMEOUT_SECS: ${RPC_REQUEST_TIMEOUT_SECS:-30}
      REDIS_URL: ${REDIS_URL}
      MARKET_TICKS_STREAM: ${MARKET_TICKS_STREAM}
      MARKET_TICKS_MAXLEN: ${MARKET_TICKS_MAXLEN}
      REDIS_BATCH_SIZE: ${REDIS_BATCH_SIZE}
      REDIS_BATCH_TIMEOUT_MS: ${REDIS_BATCH_TIMEOUT_MS}
      RAW_CHANNEL_CAPACITY: ${RAW_CHANNEL_CAPACITY}
      RECORD_CHANNEL_CAPACITY: ${RECORD_CHANNEL_CAPACITY}
      INGESTOR_HEALTHCHECK_PATH: ${INGESTOR_HEALTHCHECK_PATH}
      BACKFILL_FROM_BLOCK: ${BACKFILL_FROM_BLOCK:-}
      BACKFILL_TO_BLOCK: ${BACKFILL_TO_BLOCK:-}
      BACKFILL_CHUNK_SIZE: ${BACKFILL_CHUNK_SIZE:-100}
      BACKFILL_CONFIRMATIONS: ${BACKFILL_CONFIRMATIONS:-6}
      BACKFILL_PAUSE_MS: ${BACKFILL_PAUSE_MS:-0}
      BACKFILL_SOURCE_SUFFIX: ${BACKFILL_SOURCE_SUFFIX:-backfill}
      BACKFILL_STATE_POSTGRES_URL: ${BACKFILL_STATE_POSTGRES_URL:-}
      BACKFILL_JOB_NAME: ${BACKFILL_JOB_NAME:-default}
      BACKFILL_AUTO_CLAIM_PENDING_GAP: ${BACKFILL_AUTO_CLAIM_PENDING_GAP:-true}
      BACKFILL_DISCOVERY_CLICKHOUSE_URL: ${BACKFILL_DISCOVERY_CLICKHOUSE_URL:-}
      BACKFILL_DISCOVERY_CLICKHOUSE_DB: ${BACKFILL_DISCOVERY_CLICKHOUSE_DB:-eatlq}
      BACKFILL_DISCOVERY_CLICKHOUSE_USER: ${BACKFILL_DISCOVERY_CLICKHOUSE_USER:-default}
      BACKFILL_DISCOVERY_CLICKHOUSE_PASSWORD: ${BACKFILL_DISCOVERY_CLICKHOUSE_PASSWORD:-}
      BACKFILL_DISCOVERY_CLICKHOUSE_TABLE: ${BACKFILL_DISCOVERY_CLICKHOUSE_TABLE:-raw_evm_logs}
      BACKFILL_DISCOVERY_FROM_BLOCK: ${BACKFILL_DISCOVERY_FROM_BLOCK:-}
      BACKFILL_DISCOVERY_TO_BLOCK: ${BACKFILL_DISCOVERY_TO_BLOCK:-}
      BACKFILL_DISCOVERY_MIN_GAP_SIZE: ${BACKFILL_DISCOVERY_MIN_GAP_SIZE:-1}
      BACKFILL_DISCOVERY_MAX_GAP_SIZE: ${BACKFILL_DISCOVERY_MAX_GAP_SIZE:-20}
      BACKFILL_DISCOVERY_INCLUDE_EDGE_GAPS: ${BACKFILL_DISCOVERY_INCLUDE_EDGE_GAPS:-false}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
    networks:
      - eatlq-net
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  backfill-scheduler:
    build:
      context: ../..
      dockerfile: services/ingestor/Dockerfile
    profiles: ["backfill"]
    command: ["backfill_scheduler"]
    restart: unless-stopped
    environment:
